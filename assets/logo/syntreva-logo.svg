<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none" width="100%" height="100%">
  <defs>
    <!-- Sage Green to Deep Sage Gradients -->
    <linearGradient id="syn-sage-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DAD7CD" />
      <stop offset="30%" stop-color="#A3B18A" />
      <stop offset="70%" stop-color="#588157" />
      <stop offset="100%" stop-color="#3A5A40" />
    </linearGradient>

    <linearGradient id="syn-sage-accent" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F4F3EE" />
      <stop offset="45%" stop-color="#A3B18A" />
      <stop offset="100%" stop-color="#588157" />
    </linearGradient>

    <linearGradient id="syn-orbit-grad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#A3B18A" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#588157" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#3A5A40" stop-opacity="0.1" />
    </linearGradient>

    <filter id="syn-sage-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient Sage Glow Aura -->
  <circle cx="100" cy="100" r="70" fill="url(#syn-sage-grad)" opacity="0.12" filter="url(#syn-sage-glow)" />

  <!-- Outer Orbital Arc (Precision Engineering Horizon) -->
  <path d="M 148 52 C 172 78, 170 124, 142 152 C 116 178, 70 174, 46 148" 
        stroke="url(#syn-sage-grad)" 
        stroke-width="3.5" 
        stroke-linecap="round" 
        stroke-dasharray="140 30"
        opacity="0.85" />

  <!-- Inner Counter Orbital Arc -->
  <path d="M 52 148 C 28 122, 30 76, 58 48 C 84 22, 130 26, 154 52" 
        stroke="url(#syn-sage-accent)" 
        stroke-width="3" 
        stroke-linecap="round" 
        stroke-dasharray="140 30"
        opacity="0.75" />

  <!-- Abstract Futuristic S Geometry -->
  <path d="M 136 68 C 136 48, 118 36, 98 36 C 74 36, 58 50, 58 72 C 58 92, 76 102, 102 110 C 130 119, 144 130, 144 150 C 144 172, 124 186, 96 186 C 70 186, 52 172, 48 152" 
        stroke="url(#syn-sage-grad)" 
        stroke-width="13" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        fill="none" />

  <!-- Inner Precision Core Ribbon -->
  <path d="M 130 68 C 130 52, 116 42, 98 42 C 78 42, 66 52, 66 70 C 66 85, 80 94, 104 102 C 132 111, 140 124, 140 144 C 140 162, 122 176, 98 176" 
        stroke="#F4F3EE" 
        stroke-width="2.5" 
        stroke-linecap="round" 
        opacity="0.9"
        fill="none" />

  <!-- Nodes / Quantum Points -->
  <circle cx="136" cy="68" r="4.5" fill="#DAD7CD" />
  <circle cx="48" cy="152" r="4.5" fill="#A3B18A" />
  <circle cx="100" cy="106" r="3.5" fill="#F4F3EE" />
</svg>
